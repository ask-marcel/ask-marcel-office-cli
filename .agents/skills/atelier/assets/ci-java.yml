# .github/workflows/ci.yml (Java/Quarkus variant) - the authoritative gate set (rules 4.6, 15.1)
#
# CI runs every gate, fast and slow, so a bypassed local hook is still caught.
# This is the required merge check; the pre-commit-java hook is the fast first
# line. Make it a required status check in branch protection (rule 13.2).
#
# The CVE scan and the vendored-standard check are NOT here: both change
# independently of your diff, so they ride in audit-java.yml on a schedule
# rather than blocking an unrelated commit (references/workflow.md).
#
# Actions are pinned to major tags for readability; pin to a commit SHA for
# supply-chain safety in a real repo (rule 5.4).
name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for gitleaks detect
      - name: commit messages (Conventional Commits, rule 23 / canon 1.3)
        run: bash scripts/check-commit-messages.sh
      - name: commit size per commit in the range (gate 1 / canon 8.1)
        run: bash scripts/check-commit-range.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: pom sanity (no ranges / -SNAPSHOT)
        run: bash scripts/check-pom.sh
      - name: install gitleaks (pinned; not preinstalled on ubuntu runners)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          sudo install gitleaks /usr/local/bin/ && rm gitleaks
      - name: secret scan (full history)
        run: gitleaks detect --redact --no-banner
      - name: format check
        run: ./mvnw -q spotless:check
      - name: verify (compile -Werror, unit + integration tests, JaCoCo tiers)
        run: ./mvnw -q verify
      - name: mutation (PIT, >= 90 on domain and usecases)
        run: ./mvnw -q test-compile org.pitest:pitest-maven:mutationCoverage
