# .github/workflows/ci.yml (Java/Quarkus variant) - the authoritative gate set (canon 4.6, 15.1)
#
# CI runs every gate, fast and slow, so a bypassed local hook is still caught.
# This is the required merge check; the pre-commit-java hook is the fast first
# line. Make it a required status check in branch protection (canon 13.2).
#
# The CVE scan and the vendored-standard check are NOT here: both change
# independently of your diff, so they ride in audit-java.yml on a schedule
# rather than blocking an unrelated commit (references/workflow.md).
#
# Actions are pinned to major tags for readability; pin to a commit SHA for
# supply-chain safety in a real repo (canon 5.4).
name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # ready_for_review: a draft marked ready runs CI again, so the land job sees it
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  gates:
    runs-on: ubuntu-latest
    env:
      # The left side of the pushed range for the two commit gates and pit-changed.sh. On a push to
      # main HEAD already equals origin/main, so without this they would check an
      # empty range and pass vacuously. Empty on a pull request (the base ref wins).
      GITHUB_EVENT_BEFORE: ${{ github.event.before }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for the gitleaks history scan and pit-changed.sh
      - name: commit messages (Conventional Commits, rule 23 / canon 1.3)
        run: bash scripts/check-commit-messages.sh
      - name: commit size per commit in the range (gate 1 / canon 8.1)
        run: bash scripts/check-commit-range.sh
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: pom sanity (no ranges / -SNAPSHOT / no mock library)
        run: bash scripts/check-pom.sh
      - name: no inline suppression anywhere in the tree (rule 15)
        run: bash scripts/check-no-suppressions.sh --all
      - name: install gitleaks (pinned and checksum-verified; not preinstalled on ubuntu runners)
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          # SHA-256 from the release's gitleaks_8.30.1_checksums.txt; a version bump changes both lines
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks && sudo install gitleaks /usr/local/bin/ && rm gitleaks gitleaks.tar.gz
      - name: secret scan (full history)
        run: gitleaks git --ignore-gitleaks-allow --redact --no-banner
      - name: identity in file contents (rule 26, the whole tree)
        env:
          # the host's own answer: rule 26 blocks in a public repository, warns in a private one
          REPO_VISIBILITY: ${{ github.event.repository.private && 'private' || 'public' }}
        run: bash scripts/check-identity.sh --all
      - name: discipline tripwires (rules 27, 29, 30, the whole tree)
        run: bash scripts/check-disciplines.sh --all
      - name: format check
        run: ./mvnw -q spotless:check
      - name: verify (compile -Werror, unit + integration tests in random order, JaCoCo tiers)
        # JUnit's random orderers log their seed below INFO, so a red order could not be
        # replayed: the step picks the seed and prints it (rule 36).
        run: |
          seed="$(od -An -N4 -tu4 /dev/urandom | tr -d ' ')"
          echo "junit random-order seed: $seed (replay: ./mvnw verify -Djunit.jupiter.execution.order.random.seed=$seed)"
          ./mvnw -q verify -Djunit.jupiter.execution.order.random.seed="$seed"
      - name: README Verify block runs (canon 12.1, references/governance.md)
        run: bash scripts/check-docs.sh
      - name: mutation (PIT on the changed classes only, >= 90; the full sweep is mutation-java.yml, daily)
        run: bash scripts/pit-changed.sh
  land:
    # Land on green (rule 38; references/workflow.md, Landing on green): once every job above passed
    # on a pull request, rebase-merge it pinned to the tested head and delete its branch, so nobody
    # presses merge and nothing lands red. A draft, a fork and the repository variable
    # LAND_ON_GREEN=off skip it. A merge made with GITHUB_TOKEN starts no push run on main, so the
    # script refuses when main moved since CI ran, and waits for the checks of other workflows.
    needs: [gates]
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository && vars.LAND_ON_GREEN != 'off'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: read
    steps:
      - uses: actions/checkout@v7
      - name: land on green (rebase merge, pinned to the tested head)
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          LAND_JOB: land
        run: bash scripts/land-on-green.sh
