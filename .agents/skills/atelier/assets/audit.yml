# .github/workflows/audit.yml - the dependency CVE watchdog (workflow.md,
# Dependency scanning). Deliberately NOT part of the gates job: advisories
# change daily and independently of any diff, so this blocks only the runs
# that touch the dependency tree, plus a scheduled daily sweep.
name: audit
on:
  schedule:
    - cron: '0 6 * * *'        # daily watchdog: new CVEs in untouched deps
  pull_request:
    paths:                      # PR run fires only when deps actually change
      - package.json
      - bun.lock
      - .claude/skills/**        # a re-sync of the standard is a dependency change
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile   # also fails on lockfile drift, a supply-chain check in itself
      - run: bun audit --audit-level=high
      # A vendored standard is a dependency too (references/governance.md): it
      # goes stale silently while every other gate stays green. Scheduled, not
      # a commit gate, for the same reason as the CVE scan above.
      - name: vendored standard is current
        run: bash scripts/check-skill-pin.sh
      # An advisory with no upstream fix is allow-listed here, project-level, with a reason:
      # - run: bun audit --audit-level=high --ignore GHSA-xxxx-xxxx-xxxx  # no patched release as of YYYY-MM-DD; tracking <link>
