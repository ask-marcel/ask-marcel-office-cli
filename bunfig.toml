[install]
# Bun workspaces (package split, D3): each folder resolves its dependencies
# from the root node_modules, as the single package always did.
linker = "hoisted"

[test]
# The root has no source and no tests of its own: each workspace folder (core/,
# auth/, read/, write/) runs its own tests with its own bunfig.toml, and
# `bun run test` runs them all. A bare `bun test` at the root still refuses the
# real network. See scripts/no-network-preload.ts.
preload = ["./scripts/no-network-preload.ts"]
