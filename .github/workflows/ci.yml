# .github/workflows/ci.yml - the authoritative gate set (rules 4.6, 15.1)
#
# CI runs every gate, fast and slow, on a frozen lockfile, so a bypassed local
# hook is still caught. This is the line that cannot be skipped with
# --no-verify: make it a required status check in branch protection (rule 13.2),
# and nothing merges while it is red. The pre-commit hook (.githooks/pre-commit)
# is the fast first line; this is the real one.
#
# Adapted from the atelier assets/ci.yml template, with three deviations that
# this repo's shape forces. Each is deliberate; do not "restore" them without
# reading the reason.
#
#   1. gitleaks is installed explicitly. The template runs `gitleaks detect`
#      directly, but stock ubuntu-latest runners do not ship it.
#   2. No coverage-preload --check step. scripts/coverage-preload.ts here is
#      hand-maintained and deliberately BROADER than the upstream generator:
#      it preloads 75 src/use-cases files as well as the infra tier, so untested
#      use-cases show at 0% and fail the gate. The generator only scans
#      src/{infra,composition,presenter} and would delete those 75 imports,
#      weakening the gate. The upstream regenerator is intentionally not
#      installed in this repo.
#   3. No full `bun run mutate` sweep on main. The mutation scope here is 266
#      files; at the documented 1-3 min/file a full sweep is 4-13 hours against
#      a 6-hour job limit, so it would time out and sit permanently red. Main
#      pushes mutate the merged change (BASE=HEAD~1) instead. Run the full
#      `bun run mutate` as a periodic manual audit, not per push.
name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for gitleaks detect and mutate:changed
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile # lockfile drift fails here (rule 5.3)
      - name: package.json (no latest / * / bare dist-tag)
        run: bash scripts/check-package-json.sh
      - name: install gitleaks
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: secret scan (full history)
        run: gitleaks detect --redact --no-banner
      - name: lint (strict, type-aware, zero errors AND zero warnings)
        run: bun run lint:strict
      - name: typecheck
        run: bun run typecheck
      - name: tests
        run: bun test
      - name: coverage (per-tier thresholds)
        run: bun run coverage
      - name: mutation (changed files; see deviation 3 in the header)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            bun run mutate:changed
          else
            BASE=HEAD~1 bun run mutate:changed
          fi
      - name: dependency CVEs (fails on high)
        run: bun audit --audit-level=high
