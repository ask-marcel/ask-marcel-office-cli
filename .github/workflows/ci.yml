# .github/workflows/ci.yml - the authoritative gate set (rules 4.6, 15.1)
#
# CI runs every gate, fast and slow, on a frozen lockfile, so a bypassed local
# hook is still caught. This is the line that cannot be skipped with
# --no-verify: make it a required status check in branch protection (rule 13.2),
# and nothing merges while it is red. The pre-commit hook (.githooks/pre-commit)
# is the fast first line; this is the real one.
#
# Adapted from the atelier assets/ci.yml template, with three deviations that
# this repo's shape forces. Each is deliberate; do not "restore" them without
# reading the reason.
#
#   1. gitleaks is installed explicitly. The template runs `gitleaks detect`
#      directly, but stock ubuntu-latest runners do not ship it.
#   2. No coverage-preload --check step. scripts/coverage-preload.ts here is
#      hand-maintained and deliberately BROADER than the upstream generator:
#      it preloads 75 src/use-cases files as well as the infra tier, so untested
#      use-cases show at 0% and fail the gate. The generator only scans
#      src/{infra,composition,presenter} and would delete those 75 imports,
#      weakening the gate. The upstream regenerator is intentionally not
#      installed in this repo.
#   3. No full `bun run mutate` sweep on main. The mutation scope here is 266
#      files; at the documented 1-3 min/file a full sweep is 4-13 hours against
#      a 6-hour job limit, so it would time out and sit permanently red. Main
#      pushes mutate the WHOLE PUSHED RANGE instead (BASE=github.event.before),
#      not BASE=HEAD~1: a push of several commits mutated only the last one's
#      files, so on 2026-08-30 two of three commits were never mutated at all
#      and the survivors they added surfaced a push later. Run the full
#      `bun run mutate` as a periodic manual audit, not per push.
name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for gitleaks detect and mutate:changed
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile # lockfile drift fails here (rule 5.3)
      - name: package.json (no latest / * / bare dist-tag)
        run: |
          bash scripts/check-package-json.sh --selftest
          bash scripts/check-package-json.sh
      - name: commit-msg hook selftest (a non-conventional header is rejected)
        run: bash scripts/commit-msg-selftest.sh
      - name: install gitleaks
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: secret scan (full history)
        run: gitleaks detect --redact --no-banner
      - name: lint (strict, type-aware, zero errors AND zero warnings)
        run: bun run lint:strict
      - name: lint fixtures (every path-scoped rule still fires on its files, and only there)
        run: bun run scripts/check-lint-fixtures.ts
      - name: typecheck
        run: bun run typecheck
      - name: tests
        run: bun test
      - name: coverage gate selftest (a file below its tier and a file outside every tier are rejected)
        run: bun run scripts/check-coverage.ts --selftest
      - name: coverage (per-tier thresholds)
        run: bun run coverage
      - name: doc numbers match the registry (selftest first, so the gate proves it can fail)
        run: |
          bun run scripts/check-doc-numbers.ts --selftest
          bun run check:docs
      - name: mutation scope selftest (a pure move mutates nothing, a sub-folder run maps its paths)
        run: bash scripts/mutation-scope-selftest.sh
      - name: mutation (changed files; see deviation 3 in the header)
        env:
          # The branch tip BEFORE this push. Read via env rather than inlined,
          # so the shell never interpolates a ref name into its own source.
          PUSHED_FROM: ${{ github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            bun run mutate:changed
          elif [ -n "$PUSHED_FROM" ] \
            && [ "$PUSHED_FROM" != "0000000000000000000000000000000000000000" ] \
            && git rev-parse --verify --quiet "$PUSHED_FROM^{commit}" >/dev/null; then
            BASE="$PUSHED_FROM" bun run mutate:changed
          else
            # First push to the branch, or a force-push whose old tip is gone.
            BASE=HEAD~1 bun run mutate:changed
          fi
      - name: dependency CVEs (fails on high)
        run: bun audit --audit-level=high
  smoke:
    # The shipped bundle, run the way users run it: from dist, and installed from
    # the packed tarball into an empty directory outside the repo. A separate job
    # with no `needs`: the packed install pulls dependencies fresh from the
    # registry, so an outage or a broken upstream release fails this job without
    # blocking mutation and the audit in `gates` (a red push there would leave its
    # range unmutated). Node 20 is the floor `engines` promises. The smokes run as
    # `bun <file>`, not `bun run <file>`, so bun never puts its own `node` shim on
    # PATH and the node probes really run on node.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: bun install --frozen-lockfile
      - name: build (the bundle the package ships)
        run: bun run build
      - name: bundle smoke (every converter and the MCP stdout handshake, from dist, under node and bun)
        timeout-minutes: 10
        run: bun scripts/qa-bundle-smoke.ts
      - name: packed-install smoke (the tarball installs and runs outside the repo)
        timeout-minutes: 10
        run: bun scripts/qa-packed-install-smoke.ts
