# .github/workflows/ci.yml - the authoritative gate set (rules 4.6, 15.1)
#
# CI runs every gate, fast and slow, on a frozen lockfile, so a bypassed local
# hook is still caught. This is the line that cannot be skipped with
# --no-verify: make it a required status check in branch protection (rule 13.2),
# and nothing merges while it is red. The pre-commit hook (.githooks/pre-commit)
# is the fast first line; this is the real one.
#
# Adapted from the atelier assets/ci.yml template, with two deviations that
# this repo's shape forces. Each is deliberate; do not "restore" them without
# reading the reason.
#
#   1. gitleaks is installed explicitly. The template runs `gitleaks detect`
#      directly, but stock ubuntu-latest runners do not ship it.
#   2. No full `bun run mutate` sweep on main. Read's mutation scope is 273
#      files; at the documented 1-3 min/file a full sweep is 4-13 hours against
#      a 6-hour job limit, so it would time out and sit permanently red. Main
#      pushes mutate the WHOLE PUSHED RANGE instead (BASE=github.event.before),
#      not BASE=HEAD~1: a push of several commits mutated only the last one's
#      files, so on 2026-08-30 two of three commits were never mutated at all
#      and the survivors they added surfaced a push later. Run the full
#      `bun run mutate` as a periodic manual audit, not per push. The pushed
#      range can still be large (241 commits on 2026-10-15 ran past the job
#      limit), so read's mutation runs in its own `mutation` job, in 8
#      parallel shards.
#
# Package split (docs/plans/2026-10-01-package-split.md, Checks and CI): the
# root holds no package since phase 6. `gates` is the repo-wide job: the
# scripts, their selftests, the docs gate, the secret scan and the audit.
# `workspace` runs one job per workspace folder (core, auth, read, write)
# with the folder's own configs; `gates` fails when the matrix misses a folder.
# `mutation` and `smoke` run read's mutation shards and smokes in read/ (they
# keep their ids, which branch protection requires). `windows-helper` runs the
# token helper round trip on Windows.
name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for gitleaks detect and mutate:changed
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile # lockfile drift fails here (rule 5.3)
      - name: package.json (no latest / * / bare dist-tag)
        run: |
          bash scripts/check-package-json.sh --selftest
          bash scripts/check-package-json.sh
      - name: workspace check selftests (hook dispatch, folder coverage preload, packed output, CI matrix)
        run: |
          bash scripts/staged-folders.sh --selftest
          bun scripts/coverage-preload-tiers-selftest.ts
          bun scripts/check-packed-package.ts --selftest
          bun scripts/check-ci-matrix.ts --selftest
      - name: the workspace matrix covers every workspace folder (no folder goes ungated or unmutated)
        run: bun scripts/check-ci-matrix.ts
      - name: commit-msg hook selftest (a non-conventional header is rejected)
        run: bash scripts/commit-msg-selftest.sh
      - name: commit messages (every pushed commit passes the commit-msg hook, --no-verify included)
        env:
          # The branch tip BEFORE this push. On a push the script's default
          # range, origin/main..HEAD, is empty and would pass having checked nothing.
          PUSHED_FROM: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            bash scripts/check-commit-messages.sh
          else
            bash scripts/check-commit-messages.sh "${PUSHED_FROM}..HEAD"
          fi
      - name: install gitleaks
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: secret scan (full history)
        run: gitleaks detect --redact --no-banner
      - name: lint (strict, type-aware, zero errors AND zero warnings; the root config files)
        run: bun run lint:strict
      - name: lint fixtures (every path-scoped rule still fires on its files, and only there)
        run: bun run scripts/check-lint-fixtures.ts
      - name: read bundle (the read graph and the read commands, built alone, hold no write method; a control with the write graph shows them)
        run: bun run check:read-bundle
      - name: package imports (a write module reaches only core and write; no read command and no core module reaches write; fixtures prove it can fail)
        run: bun run check:package-imports
      - name: typecheck (the scripts)
        run: bun run typecheck
      - name: coverage gate selftest (a file below its tier and a file outside every tier are rejected)
        run: bun run scripts/check-coverage.ts --selftest
      - name: doc numbers match the registry (selftest first, so the gate proves it can fail)
        run: |
          bun run check:docs --selftest
          bun run check:docs
      - name: mutation scope selftest (a pure move mutates nothing, a sub-folder run maps its paths)
        run: bash scripts/mutation-scope-selftest.sh
      - name: dependency CVEs (fails on high)
        run: bun audit --audit-level=high
  mutation:
    # Read's mutation, run in read/ and divided over parallel shards. One job
    # ran into the 6-hour job limit on 2026-10-15: a push of 241 commits gave
    # 13888 mutants. Each shard mutates every SHARD_COUNT-th file of the same
    # scope (scope_shard in scripts/mutation-scope.sh), so the shards together
    # cover the whole scope once, and each shard must reach the break score
    # alone. The workspace job skips read's mutation, so it runs here only;
    # scripts/check-ci-matrix.ts checks both.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    defaults:
      run:
        working-directory: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for mutate:changed
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
        working-directory: .
      - name: mutation (read's changed files, shard ${{ matrix.shard }} of 8; see deviation 2 in the header)
        env:
          # The branch tip BEFORE this push. Read via env rather than inlined,
          # so the shell never interpolates a ref name into its own source.
          PUSHED_FROM: ${{ github.event.before }}
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_COUNT: 8
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            bun run mutate:changed
          elif [ -n "$PUSHED_FROM" ] \
            && [ "$PUSHED_FROM" != "0000000000000000000000000000000000000000" ] \
            && git rev-parse --verify --quiet "$PUSHED_FROM^{commit}" >/dev/null; then
            BASE="$PUSHED_FROM" bun run mutate:changed
          else
            # First push to the branch, or a force-push whose old tip is gone.
            BASE=HEAD~1 bun run mutate:changed
          fi
  smoke:
    # Read's shipped bundle, run the way users run it: from dist, and installed
    # from the packed tarball into an empty directory outside the repo. A
    # separate job with no `needs`: the packed install pulls dependencies fresh
    # from the registry, so an outage or a broken upstream release fails this job
    # without blocking the `mutation` job or the audit in `gates` (a red push
    # there would leave its range unmutated). Node 20 is the floor `engines`
    # promises. The smoke scripts run the smokes as `bun <file>`, not
    # `bun run <file>`, so bun never puts its own `node` shim on PATH and the
    # node probes really run on node (each smoke prints the node version).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: bun install --frozen-lockfile
        working-directory: .
      - name: build (the bundle the package ships)
        run: bun run build
      - name: bundle smoke (every converter and the MCP stdout handshake, from dist, under node and bun)
        timeout-minutes: 10
        run: bun run smoke
      - name: packed-install smoke (the tarball installs and runs outside the repo)
        timeout-minutes: 10
        run: bun run smoke:packed
  workspace:
    # One job per workspace folder (package split, D7), run from the folder with
    # its own configs. scripts/check-ci-matrix.ts (in `gates`) fails when a
    # folder of the root package.json has no entry here. `published` folders
    # also build, pack, and install the tarball into a clean consumer (node 20 is
    # the floor that `engines` promises). auth and write also run their bundle
    # smoke; read runs its smokes and its mutation in the `smoke` and `mutation`
    # jobs.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - folder: core
            published: false
          - folder: auth
            published: true
          - folder: read
            published: true
          - folder: write
            published: true
    defaults:
      run:
        working-directory: ${{ matrix.folder }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for mutate:changed
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: bun install --frozen-lockfile
        working-directory: .
      - name: lint (strict, type-aware, zero errors AND zero warnings)
        run: bun run lint:strict
      - name: typecheck
        run: bun run typecheck
      - name: tests
        run: bun test
      - name: coverage (every tier at 100%; the preload lists the folder's tier files itself)
        run: bun run coverage
      - name: mutation (changed files of this folder; see deviation 2 in the header; read mutates in the `mutation` job)
        if: matrix.folder != 'read'
        env:
          PUSHED_FROM: ${{ github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            bun run mutate:changed
          elif [ -n "$PUSHED_FROM" ] \
            && [ "$PUSHED_FROM" != "0000000000000000000000000000000000000000" ] \
            && git rev-parse --verify --quiet "$PUSHED_FROM^{commit}" >/dev/null; then
            BASE="$PUSHED_FROM" bun run mutate:changed
          else
            BASE=HEAD~1 bun run mutate:changed
          fi
      - name: build (bundles with core inlined, declarations with core under dist/shared)
        if: matrix.published
        run: bun run build
      - name: packed output (no core outside devDependencies or in a .d.ts) and a clean consumer (bin, library, deliberate type errors)
        if: matrix.published
        timeout-minutes: 10
        run: bun run check:packed
      - name: bundle smoke (auth - the token helper and the auth MCP server; write - the write bin, its MCP server and its library; from dist, under node and bun, on temporary homes)
        if: matrix.folder == 'auth' || matrix.folder == 'write'
        timeout-minutes: 10
        run: bun run smoke
  windows-helper:
    # The token helper round trip on Windows, where spawning through an npm .cmd
    # shim fails without a shell: a fixture cache, then `token --tier basic`
    # spawned through the locator file the way read spawns it. Offline.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: bun install --frozen-lockfile
      - name: token helper round trip (node and bun runners)
        timeout-minutes: 5
        run: bun scripts/qa-token-helper-roundtrip.ts
